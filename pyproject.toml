[project]
name = "afyservers"
version = "0.1.0"
description = "LabRAD servers for AFY lab"
requires-python = ">=3.8"
dependencies = [
    "twisted>=23.10.0",
    "pyserial>=3.5",
    "pyopenssl>=25.3.0",
    "service-identity>=24.2.0",
    "numpy>=1.24.4",
    "pyparsing>=3.1.4",
    "requests>=2.32.4",
    "matplotlib>=3.7.0",
    "h5py>=3.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
